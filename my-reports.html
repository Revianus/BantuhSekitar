<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Saya - BantuSekitar</title><link rel="stylesheet" href="css/style.css?v=3"><link rel="stylesheet" href="css/reports.css"></head><body><nav><a class="brand" href="index.html">BantuSekitar</a><div><a href="reports.html">Semua Laporan</a><a href="create-report.html" class="button">Buat Laporan</a></div></nav><div class="container"><h1>Laporan Saya</h1><div class="toolbar"><select id="filter"><option value="">Semua</option><option>Menunggu</option><option>Diverifikasi</option><option>Diproses</option><option>Selesai</option><option>Ditolak</option></select></div><div id="grid" class="report-grid"><p class="muted">Memuat...</p></div></div><script type="module">import { ref, onValue } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
import { db } from './js/firebase-config.js';
import { requireAuth } from './js/auth.js';
const grid=document.querySelector('#grid'),filter=document.querySelector('#filter');
let uid=null,all=[];
requireAuth().then(({user})=>{uid=user.uid;onValue(ref(db,'reports'),snap=>{all=Object.entries(snap.val()||{}).map(([id,v])=>({id,...v})).filter(r=>r.userId===uid);render();});});
function render(){let list=[...all];if(filter.value) list=list.filter(r=>r.status===filter.value);list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));grid.innerHTML=list.map(r=>`<a href="report-detail.html?id=${r.id}" class="report-card" style="text-decoration:none;color:inherit"><img src="${escAttr(r.photoUrl||'https://via.placeholder.com/600x400?text=No+Image')}"><div class="body"><span class="badge ${escAttr(r.status)}">${esc(r.status)}</span><strong>${esc(r.title)}</strong><span class="muted">${esc(r.category)} Â· ${new Date(r.createdAt).toLocaleDateString('id-ID')}</span></div></a>`).join('')||'<p class="muted">Anda belum membuat laporan.</p>';}
filter.addEventListener('change',render);
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function escAttr(v){return String(v).replace(/"/g,'&quot;')}
</script>  <script src="js/nav.js?v=3"></script>`n</body></html>
