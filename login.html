<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk - BantuSekitar</title><link rel="stylesheet" href="css/style.css?v=12"><link rel="stylesheet" href="css/auth.css"></head><body><div class="auth-wrap"><form id="form" class="auth-card"><h1>Masuk</h1><p>Gunakan email dan password Firebase Authentication.</p><label>Email</label><input id="email" type="email" required placeholder="nama@email.com"><label>Password</label><input id="password" type="password" required placeholder="********"><button id="btn" type="submit">Masuk</button><div id="msg" class="msg"></div><p style="margin-top:14px">Belum punya akun? <a href="register.html">Daftar</a> · <a href="index.html">Beranda</a></p></form></div><script type="module">import { login } from './js/auth.js';
const form=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#btn');
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';msg.className='msg';btn.disabled=true;btn.textContent='Memproses...';try{await login(email.value.trim(),password.value);location.href='dashboard.html'}catch(err){msg.textContent=err.message;msg.className='msg err';btn.disabled=false;btn.textContent='Masuk'}});
</script>  <script src="js/nav.js?v=12"></script></body></html>
