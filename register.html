<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - BantuSekitar</title><link rel="stylesheet" href="css/style.css?v=13"><link rel="stylesheet" href="css/auth.css"></head><body><div class="auth-wrap"><form id="form" class="auth-card"><h1>Daftar</h1><p>Akun disimpan di Firebase Authentication dan profil di diupdate langsung.</p><label>Nama</label><input id="name" required placeholder="Nama lengkap"><label>Email</label><input id="email" type="email" required placeholder="nama@email.com"><label>Password</label><input id="password" type="password" required minlength="6" placeholder="Minimal 6 karakter"><button id="btn" type="submit">Buat Akun</button><div id="msg" class="msg"></div><p style="margin-top:14px">Sudah punya akun? <a href="login.html">Masuk</a></p></form></div><script type="module">import { register } from './js/auth.js';
const msg=document.querySelector('#msg'),btn=document.querySelector('#btn');
const nameInput=document.querySelector('#name'),emailInput=document.querySelector('#email'),passwordInput=document.querySelector('#password');
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';msg.className='msg';btn.disabled=true;btn.textContent='Memproses...';try{await register(nameInput.value,emailInput.value,passwordInput.value);location.href='dashboard.html'}catch(err){msg.textContent=err.message;msg.className='msg err';btn.disabled=false;btn.textContent='Buat Akun'}});
</script>  <script src="js/nav.js?v=13"></script></body></html>
